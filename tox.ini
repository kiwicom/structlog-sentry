[tox]
envlist =
  lint
  py{310,311,312,313,314,315}
isolated_build = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
deps =
    pytest
    pytest-cov
    pytest-mock
commands =
    coverage run --parallel-mode -m pytest {posargs}
    coverage combine
    coverage report

[testenv:lint]
basepython = python3
skip_install = true
deps = pre-commit
passenv = HOMEPATH  # needed on Windows
commands = pre-commit run --all-files

[isort]
profile = black
filter_files = true
known_first_party = pytest,sentry_sdk,structlog

[flake8]
max-line-length = 88

[pytest]
testpaths = test
